<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOTHIC-TILES</title>
    <script src="https://www.youtube.com/game_api/v1"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.json" />
    <link
      rel="shortcut icon"
      href="assets/img/PentaCruzInvert.svg"
      type="image/svg"
    />
  </head>
  <body>
    <div id="timelapsed"></div>
    <button
      id="pause-button"
      class="pause-button"
      type="button"
      aria-label="Pausar juego"
    >
      Pausar
    </button>
    <div class="hud">
      <span class="hud-label">Tiempo</span>
      <span id="cronometro">00:00:00</span>
      <span
        id="mensaje-feedback"
        class="hud-feedback"
        aria-live="polite"
      ></span>
    </div>

    <div id="welcome-screen" class="screen active" aria-live="polite">
      <div class="screen-card">
        <!-- <p class="eyebrow">GOTHIC TILES</p> -->
        <h1>GOTHIC-TILES</h1>
        <!-- <p>
          Pulsa el botón para iniciar la secuencia y mantener la cadencia de las
          baldosas.
        </p> -->
        <button id="start-button" type="button">Iniciar partida</button>
      </div>
    </div>

    <div id="final-screen" class="screen hidden" aria-live="polite">
      <div class="screen-card">
        <p class="eyebrow">Completado</p>
        <!-- <h2>¡Nivel superado!</h2> -->
        <p>Tiempo: <span id="final-time">00:00:00</span></p>
        <button id="restart-button" type="button">Jugar otra vez</button>
      </div>
    </div>

    <canvas></canvas>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
