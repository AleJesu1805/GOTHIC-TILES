<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOTHIC-TILES</title>
    <link
      rel="preload"
      href="assets/fonts/Savage.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <script src="https://www.youtube.com/game_api/v1"></script>
    <script src="https://telegram.org"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.json" />
    <link
      rel="shortcut icon"
      href="assets/img/PentaCruzInvert.svg"
      type="image/svg"
    />
  </head>
  <body>
    <div id="timelapsed"></div>
    <button
      id="pause-button"
      class="pause-button"
      type="button"
      aria-label="Pausar juego"
    >
      Pausar
    </button>
    <div id="welcome-screen" class="screen active" aria-live="polite">
      <div class="screen-card">
        <h1>GOTHIC-TILES</h1>
        <fieldset class="level-selector">
          <legend>Selecciona un nivel</legend>
          <div class="level-list"></div>
        </fieldset>
        <button id="start-button" type="button">Iniciar partida</button>
      </div>
    </div>

    <div
      id="pause-screen"
      class="screen hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="pause-title"
    >
      <div class="screen-card pause-card">
        <p class="eyebrow">Partida en pausa</p>
        <h2 id="pause-title">Configuracion</h2>
        <section class="settings-group" aria-labelledby="audio-settings-title">
          <h3 id="audio-settings-title">Audio</h3>
          <div class="setting-row">
            <label for="music-volume">Música</label>
            <input
              id="music-volume"
              class="setting-range"
              type="range"
              min="0"
              max="100"
              value="75"
            />
            <output for="music-volume">75%</output>
          </div>
          <div class="setting-row">
            <!-- <label for="effects-volume">Efectos</label> -->
            <!-- <input
              id="effects-volume"
              class="setting-range"
              type="range"
              min="0"
              max="100"
              value="60"
            /> -->
            <!-- <output for="effects-volume">60%</output> -->
          </div>
        </section>
        <section class="settings-group" aria-labelledby="controls-title">
          <h3 id="controls-title">Controles</h3>
          <div class="control-row">
            <span>Seleccionar carril</span>
            <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd>
          </div>
        </section>
        <button id="resume-button" type="button">Continuar partida</button>
        <button class="home-button" type="button">Elegir otra cancion</button>
      </div>
    </div>

    <div
      id="final-screen"
      class="screen hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="final-title"
    >
      <div class="screen-card final-card">
        <h2 id="final-title">COMPLETADO</h2>
        <div class="final-results" aria-label="Resultados de la partida">
          <div class="final-stat">
            <span class="final-stat-label">Tiempo</span>
            <strong id="final-time">00:00:00</strong>
          </div>
          <div class="final-stat">
            <span class="final-stat-label">Rendimiento</span>
            <strong id="final-score">0%</strong>
          </div>
        </div>
        <div class="final-actions">
          <button id="restart-button" type="button">Reintentar</button>
          <button class="home-button" type="button">Volver al Inicio</button>
        </div>
      </div>
    </div>

    <canvas></canvas>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
